name: Temporary lockfile sync
on:
  push:
    branches: [maintenance/sync-lock-ci-20261021]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'automated clean lockfile')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Recreate lockfile using package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        run: npm ci
      - name: TypeScript tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "automated clean lockfile"
            git push origin HEAD:maintenance/sync-lock-ci-20261021
          fi
